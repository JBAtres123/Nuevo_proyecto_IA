server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue SPA — todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;  # 5 min para procesamiento de agentes
        client_max_body_size 50M; # para subida de imágenes
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
